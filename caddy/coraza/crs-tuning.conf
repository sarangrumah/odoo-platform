# ============================================================
# Our deviations from the shipped CRS crs-setup.conf.
#
# Included AFTER /etc/coraza/coreruleset/crs-setup.conf and BEFORE the rules, so
# a CRS version bump keeps the upstream defaults and these overrides both — the
# alternative (editing a copied crs-setup.conf) silently loses upstream changes
# at every bump.
#
# Anomaly-scoring mode is CRS's own default and is kept: each matching rule adds
# to a score and only the total decides. That is what makes a single noisy rule
# harmless, and it is why the thresholds below — not individual rules — are the
# dial to turn if the WAF is too strict.
# ============================================================

# --- Paranoia ---------------------------------------------------------------
# PL1 only. Higher levels add rules that flag ordinary punctuation, and Odoo's
# JSON-RPC bodies are nothing but punctuation; PL2 in front of a backoffice is a
# reliable way to make people distrust the WAF and switch it off. Raise this only
# after a period with a clean audit log at PL1.
SecAction "id:1000000,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.blocking_paranoia_level=1,\
    setvar:tx.detection_paranoia_level=1"

# --- Anomaly thresholds -----------------------------------------------------
# Inbound 5 is CRS's default and means "one critical rule is enough to block".
# Kept as-is deliberately: SQL injection and RCE rules are critical (score 5), so
# a single confident SQLi match blocks, while a couple of notice-level oddities
# (score 2 each) do not.
SecAction "id:1000001,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# --- HTTP methods -----------------------------------------------------------
# Odoo's web client uses GET/POST/HEAD/OPTIONS; File Browser adds PUT/PATCH/DELETE
# for the drop zone. Everything else — TRACE, TRACK, CONNECT, the WebDAV verbs
# scanners use to find writable paths — has no caller here.
SecAction "id:1000002,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# --- Content types ----------------------------------------------------------
# The CRS default list does not include the types Odoo actually posts. Missing
# ones surface as 920420 blocks on completely ordinary traffic.
SecAction "id:1000003,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |text/plain| |application/octet-stream|'"

# --- Response codes not to report -------------------------------------------
# 404 is the normal answer to the scanner probes Caddy already refuses at the
# edge; leaving it in would fill the audit log with traffic that never reached an
# application. See SecAuditLogRelevantStatus in coraza.conf.

# --- Sampling ---------------------------------------------------------------
# No sampling: this host handles tens of requests per second, not thousands, and
# a WAF that inspects a fraction of requests cannot be reasoned about.
SecAction "id:1000004,\
    phase:1,\
    nolog,\
    pass,\
    t:none,\
    setvar:tx.sampling_percentage=100"
