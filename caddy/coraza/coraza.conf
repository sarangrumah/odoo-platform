# ============================================================
# Coraza engine configuration for the front door.
#
# This is the equivalent of ModSecurity's modsecurity.conf-recommended, written
# out rather than vendored so every value that matters in front of Odoo is a
# deliberate choice with the reason next to it.
#
# Load order (see caddy/Caddyfile, `coraza_waf` block):
#   1. this file            engine + body handling + logging
#   2. crs-setup.conf       CRS tuning (paranoia, anomaly thresholds)
#   3. coreruleset/rules/*  the rules themselves
#   4. exclusions.conf      our Odoo-specific false-positive removals
#
# SecRuleEngine is deliberately NOT set here — the Caddyfile sets it last, after
# the rules load, so the detect-only/blocking switch lives in one obvious place.
# ============================================================

# --- Request bodies ---------------------------------------------------------
# Body inspection is the entire point for SQL injection: Odoo's web client sends
# every model call as a JSON POST to /web/dataset/call_kw/..., so a URL-only WAF
# would inspect none of the interesting traffic.
SecRequestBodyAccess On

# Body PROCESSOR selection. This is not optional decoration: without it Coraza
# treats a JSON body as urlencoded, fails to find any `=`, and exposes the entire
# raw document as ONE argument name. Every ordinary Odoo RPC call then trips
# 921150 (CR/LF in ARGS_NAMES — the pretty-printed newlines) and gets a 403,
# while the values inside the body are never actually inspected. Both halves of
# that are bad: total false positives and no real coverage.
#
# Rule ids 2000xx are the conventional range for these; they mirror the block
# ModSecurity ships in modsecurity.conf-recommended.
SecRule REQUEST_HEADERS:Content-Type "^application/(?:[\w.+-]+\+)?json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200002,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^multipart/(form-data|related)" \
    "id:200003,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=MULTIPART"

SecRequestBodyLimit 209715200
SecRequestBodyNoFilesLimit 1048576
SecRequestBodyInMemoryLimit 262144
# ProcessPartial rather than Reject: the 200 MB ceiling exists for Odoo's import
# wizard (base_import/execute_import runs daily with real spreadsheets), and
# rejecting a legitimate 30 MB import because the engine would rather not read
# all of it is a worse outcome than inspecting the first megabyte of it.
SecRequestBodyLimitAction ProcessPartial

# --- Response bodies --------------------------------------------------------
# Off on purpose. Response inspection buys data-leakage rules, and costs a full
# buffer of every PDF report, XLSX export and asset bundle Odoo streams — this
# host serves multi-megabyte reports routinely. The leakage classes CRS would
# catch here (stack traces, SQL errors) are better handled by not running Odoo
# in dev mode, which is already the case.
SecResponseBodyAccess Off

# --- Engine limits ----------------------------------------------------------
SecArgumentsLimit 2000
SecPcreMatchLimit 10000
SecPcreMatchLimitRecursion 10000

# --- Audit log --------------------------------------------------------------
# Serial log, relevant transactions only (E = 5xx, H = the audit trailer, Z =
# terminator). Concurrent/JSON logging is not enabled: this is a single Caddy
# instance and Promtail already ships stdout, so one greppable file is enough to
# answer "what did rule 942100 actually match on".
SecAuditEngine RelevantOnly
# Every 4xx and 5xx except 404. Written out digit by digit because Coraza matches
# with Go's RE2 engine, which has no lookahead — the ModSecurity idiom
# `^(?:5|4(?!04))` is a startup error here, not a subtly wrong filter.
SecAuditLogRelevantStatus "^(?:5\d\d|40[0-35-9]|4[1-9]\d)$"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/coraza/audit.log

# --- Default action ---------------------------------------------------------
# NOT set here. CRS's own crs-setup.conf declares `SecDefaultAction
# "phase:1,log,auditlog,pass"` and the phase:2 equivalent, and Coraza treats a
# second declaration for the same phase as a fatal config error rather than an
# override — the engine refuses to start with "SecDefaultAction already defined
# for this phase". Blocking is decided by CRS's anomaly scoring either way, so
# the dial that matters is the threshold in crs-tuning.conf.

# --- Uploads ----------------------------------------------------------------
# Files are never executed by anything in this stack and Odoo stores attachments
# outside any served directory, so there is nothing to scan them for here.
SecUploadKeepFiles Off
SecTmpDir /tmp
SecDataDir /tmp
