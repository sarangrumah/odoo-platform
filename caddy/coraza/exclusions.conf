# ============================================================
# Odoo-specific CRS exclusions for the front door.
#
# Loaded LAST, after the Core Rule Set, so the directives here can undo what CRS
# just declared. Every entry below was kept only after the false positive was
# REPRODUCED against a throwaway Caddy on the same network, and only after
# checking that removing the exclusion is what actually breaks. An earlier draft
# of this file disabled the SQLi family (942xxx) on /web/dataset/call_kw* on the
# assumption that ORM domains would trip it — measured against real payloads
# (nested domains with ilike/not in/|/&, the literal strings "select * from" and
# "DROP" inside field values, a 260 KB base64 spreadsheet import) NONE of them
# match at paranoia 1. That exclusion was removing SQLi coverage from the single
# most sensitive endpoint on the host in exchange for nothing, so it is gone.
#
# The one thing that really did cause blanket false positives was not a rule at
# all: the missing JSON body processor in coraza.conf. Fix that before excluding
# anything — see the comment on rule 200001 there.
#
# Reproducing a suspected false positive:
#   docker exec odoo19-platform-caddy \
#     grep -E '\[id "[0-9]+"\]' /var/log/coraza/audit.log | tail -20
# Read which rule matched AND which parameter it matched on, then write the
# narrowest directive that clears it — by (rule, path), never by IP, never a
# whole rule family, and never for the whole site.
# ============================================================

# --- Cost control: what gets inspected, and why not everything ---------------
# Measured on this host (25 requests each, against a path Caddy answers itself so
# no Odoo time is included):
#
#   request shape                without WAF   full CRS    after the two rules below
#   GET, no body                     21 ms      24 ms                 24 ms
#   JSON POST, 3 args                22 ms      28 ms                 28 ms
#   JSON POST, 100 args              23 ms     110 ms                 47 ms
#   JSON POST, 260 KB base64         22 ms    2723 ms                 25 ms
#
# The cost is roughly 0.8 ms per argument plus 10 us per byte inside a single
# large one, because every rule is evaluated against every argument. Odoo's RPC
# bodies are the worst possible shape for that: one screen fires several calls,
# each carrying a nested domain and context that flatten into 100+ arguments, and
# base_import posts whole spreadsheets as one base64 string. Unmitigated, opening
# a list view would have cost close to a second of pure WAF time and an import
# would have timed out.
#
# So two scoped reductions, both stated as trade-offs rather than hidden:

# 1. Bodies over 64 KB are not inspected at all. At that size the content is a
#    file — a spreadsheet import, an attachment, a PDF — and no CRS rule can say
#    anything useful about compressed bytes, while the scan costs seconds. Note
#    this is keyed on Content-Length, so a chunked request without that header is
#    still fully inspected (Odoo's XHRs always send it).
SecRule REQUEST_HEADERS:Content-Length "@gt 65536" \
    "id:1000110,\
    phase:1,\
    pass,\
    nolog,\
    ctl:requestBodyAccess=Off"

# 2. On the authenticated ORM surface (/web/dataset/*), only the SQL injection
#    family evaluates. The families removed here — XSS, RCE, LFI/RFI, PHP/Node
#    injection, SSRF, Java, disclosure, session fixation, generic — cost roughly
#    two thirds of the time and are the least applicable: /web/dataset only ever
#    carries JSON-RPC to the ORM, there is no shell, no PHP, no include() and no
#    file path in it, and every caller has already authenticated with a session
#    cookie. SQLi stays because it is the one class that could reach Postgres
#    through a crafted domain, and it stays for bodies as well as URLs — verified
#    by sending `admin' UNION SELECT password,1,1 FROM res_users--` in a call_kw
#    body and getting 403.
#
#    Residual risk, stated plainly: stored XSS posted through an authenticated
#    ORM write is not caught here. Odoo escapes field values on render and the
#    attacker needs valid credentials plus write access to the record; the WAF was
#    never the primary control for that. If that trade stops being acceptable,
#    delete this rule and accept ~85 ms per RPC.
SecRule REQUEST_URI "@rx ^/web/dataset/" \
    "id:1000111,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveByTag=attack-xss,\
    ctl:ruleRemoveByTag=attack-rce,\
    ctl:ruleRemoveByTag=attack-lfi,\
    ctl:ruleRemoveByTag=attack-rfi,\
    ctl:ruleRemoveByTag=attack-injection-php,\
    ctl:ruleRemoveByTag=attack-injection-nodejs,\
    ctl:ruleRemoveByTag=attack-injection-generic,\
    ctl:ruleRemoveByTag=attack-java,\
    ctl:ruleRemoveByTag=attack-ssrf,\
    ctl:ruleRemoveByTag=attack-disclosure,\
    ctl:ruleRemoveByTag=attack-fixation,\
    ctl:ruleRemoveByTag=attack-generic,\
    ctl:ruleRemoveByTag=attack-dos"

# --- File Browser uploads ---------------------------------------------------
# The /files drop zone is how client spreadsheets and PDFs arrive. Compressed
# binary content is statistically indistinguishable from an attack payload: a
# 200 KB upload scores 8438 against CRS (SQLi, XSS and encoding families all
# match somewhere inside the bytes) and is refused with 403.
#
# So body inspection — not the rules — is switched off for this one path. URL,
# method and headers are still evaluated, which is what covers the traffic that
# actually targets /files: the GET webshell probes (/files/zehir.php and
# friends), and those are already refused by Caddy before reaching here.
#
# Odoo's own attachment upload needs no equivalent: it is multipart/form-data,
# and the multipart processor keeps file parts out of the inspected arguments.
# Verified by uploading the same 200 KB blob to /web/binary/upload_attachment
# with the exclusion absent — clean audit log.
SecRule REQUEST_URI "@rx ^/files/api/(resources|tus)" \
    "id:1000100,\
    phase:1,\
    pass,\
    nolog,\
    ctl:requestBodyAccess=Off"

# --- QWeb template editing: no rule needed any more --------------------------
# Saving a report layout posts raw HTML with <script> and inline styles, which
# CRS reads as stored XSS (941100/941110/941160, measured score 15, blocked). It
# had its own narrow exclusion until rule 1000111 above removed the XSS family
# from the whole /web/dataset/* surface for cost reasons and subsumed it. Kept as
# a note rather than a rule: if 1000111 is ever deleted, template saving breaks
# again and this is the exclusion to restore.

# --- Static assets and the live-update transports ---------------------------
# Asset bundle URLs carry a content hash and no arguments; there is nothing for a
# rule to inspect and the bodies are large. /websocket and /longpolling are the
# live-update transports: after the upgrade the connection is no longer HTTP that
# a WAF can read, so inspecting the handshake buys nothing while a false positive
# there would silently stop chatter, activity counters and screen refreshes —
# the kind of breakage that gets blamed on Odoo for weeks.
SecRule REQUEST_URI "@rx ^/(web/assets/|websocket|longpolling/)" \
    "id:1000102,\
    phase:1,\
    nolog,\
    allow"
