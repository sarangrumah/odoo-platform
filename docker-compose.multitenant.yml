# ============================================================
# Multi-tenant overlay
# ----------------------------------------------------------------
# Adds Caddy front-end with wildcard TLS for *.platform.localhost.
# Each tenant gets a subdomain; Odoo's dbfilter routes to the
# correct per-tenant DB via %d substitution.
#
# Use with:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.multitenant.yml \
#     up -d
# (or: make up-multitenant)
#
# Required env:
#   DOMAIN=platform.localhost
#   PG_ORCHESTRATOR_PASSWORD=...
#   MASTER_WRAPPING_KEY=...   (44-char Fernet key)
#   ORCHESTRATOR_SHARED_SECRET=...
#   MINIO_ROOT_PASSWORD=...
# ============================================================

services:

  caddy:
    # Not caddy:2-alpine any more: the front-door Caddyfile uses `coraza_waf`
    # (OWASP Core Rule Set) and `rate_limit`, which are Go modules that can only
    # be compiled in. caddy/Dockerfile pins Caddy 2.11.3 and both module versions
    # and checksum-verifies the rule set. Everything else about how Caddy runs is
    # unchanged — same Caddyfile, same volumes, same ports.
    #
    # The stock image cannot parse the current Caddyfile, so pointing CADDY_IMAGE
    # back at caddy:2-alpine is NOT a rollback path; reverting the Caddyfile is.
    image: ${CADDY_IMAGE:-odoo19-platform-caddy-waf:2.11.4}
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
    depends_on:
      odoo:
        condition: service_healthy
      tenant-orchestrator:
        condition: service_healthy
    environment:
      # The Caddyfile keys its whole site block on {$DOMAIN}. Without this the
      # container falls back to the placeholder default (localhost.localdomain),
      # every request to the real host matches no route, and Caddy answers an
      # empty 200 (logged as "NOP") — a dead site that still looks healthy.
      DOMAIN: ${DOMAIN:-localhost.localdomain}
      # Must be non-empty: the Caddyfile default {$ACME_EMAIL:admin@localhost}
      # only applies when the variable is UNSET, and `email` with no argument
      # is a fatal parse error.
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      # WAF engine mode, read by the Caddyfile's `coraza_waf` block:
      #   DetectionOnly  evaluate + log, never block  (safe default)
      #   On             block once the CRS anomaly score crosses the threshold
      #   Off            engine loaded, idle
      # Deploy a rules change in DetectionOnly, read
      # data/caddy/coraza/audit.log for false positives, then flip to On.
      WAF_MODE: ${WAF_MODE:-DetectionOnly}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Engine config, CRS tuning and the Odoo exclusions. Mounted (not baked in)
      # so a rule can be corrected without rebuilding the image — the rule set
      # itself lives at /etc/coraza/coreruleset INSIDE the image, which is why
      # this mount cannot be at that path.
      - ./caddy/coraza:/etc/caddy/coraza:ro
      # Coraza audit log. Bind-mounted so it survives a container recreate and can
      # be read from the host while tuning:
      #   grep -E '\[id "[0-9]+"\]' data/caddy/coraza/audit.log | tail -20
      - ./data/caddy/coraza:/var/log/coraza
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      # Storefront TLS vhost — the Caddyfile serves {$DOMAIN}:8443 for the
      # storefront. Omitting it here silently drops the storefront on the next
      # `up`, since the container is recreated from THIS definition.
      - "${CADDY_STOREFRONT_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [odoo-net]

  # Odoo dbfilter is the linchpin of tenant isolation: this overlay forces
  # the per-host DB filter on top of whatever dev/prod set.
  odoo:
    environment:
      DBFILTER: "^%d$$"
      # Trust Caddy's X-Forwarded headers; Caddy is the public-facing TLS terminator.
      PROXY_MODE: "True"
      # Multitenant default: never list DBs publicly. Set ODOO_PUBLIC_LIST_DB=True
      # in .env to open /web/database/manager on the public instance — note the
      # DBFILTER above still scopes the visible list to the requested hostname.
      LIST_DB: "${ODOO_PUBLIC_LIST_DB:-False}"

  # Management Odoo instance. Provisions/drops/upgrades per-tenant databases
  # for the tenant-orchestrator. Shares postgres + redis with the public
  # ``odoo`` service (so DBs created here are immediately visible to public
  # traffic) but has LIST_DB=True and DBFILTER=^.*$ to expose the database
  # manager + per-DB JSON-RPC.
  #
  # PRIVATE AGAIN (restored 2026-08-05). It was briefly the front-door upstream,
  # which put the database manager -- and a login into any tenant DB -- on the
  # public internet behind nothing but ODOO_ADMIN_PASSWD. The front door now
  # goes to `odoo-front` below (LIST_DB=False), and this instance is reachable
  # only on 127.0.0.1:${ODOO_MGMT_PORT} again. Its LIST_DB=True is kept because
  # the tenant-orchestrator drives db create/drop/duplicate through it.
  odoo-mgmt:
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo-mgmt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      CORETAX_SERTEL_MASTER_KEY: ${CORETAX_SERTEL_MASTER_KEY:-}
      WORKERS: "0"
      # MUST be 0: this private management instance shares the Postgres cluster
      # with the public `odoo` instance. With its own cron thread it autonomously
      # loads EVERY tenant DB's registry every few minutes (running Payment/etc.
      # crons), and the two instances then cross-invalidate each other's registry
      # + asset signaling on the shared DB — causing ~2-min registry-reload churn
      # that intermittently serves an incomplete registry (RPC 404 KeyError on
      # custom_* models) and stale asset bundles (AssetsLoadingError) in the
      # public backoffice. The public `odoo` instance (max_cron_threads=2) runs
      # all tenant crons; the orchestrator uses its own APScheduler + the odoo
      # CLI for provisioning, so it has NO dependency on odoo-mgmt cron.
      MAX_CRON_THREADS: "0"
      # NO queue_job here. The runner is owned by the public `odoo` instance, which
      # is the one with HTTP workers to actually execute the jobs. Loading it here
      # too starts a SECOND runner: DBFILTER does not apply to the runner, so this
      # instance opens every tenant DB and grabs the per-database
      # pg_try_advisory_lock. Whichever runner loses a lock raises
      # MasterElectionLost, closes all its connections and restarts
      # initialize_databases -- forever. With two runners both lose, and NO job runs
      # in ANY database (silently: the election loss is logged at DEBUG). It also
      # contradicts MAX_CRON_THREADS=0 above, whose whole point is to keep this
      # instance from autonomously loading every tenant registry.
      SERVER_WIDE_MODULES: "base,web"
      # Management instance MUST expose the database manager + accept any DB.
      LIST_DB: "True"
      DBFILTER: "^.*$$"
      # Caddy fronts this instance for the bare-IP host (see caddy/Caddyfile):
      # it terminates TLS, so without proxy_mode Odoo builds its redirects from
      # the internal http:// hop and bounces the browser out of https.
      PROXY_MODE: "True"
      WITHOUT_DEMO: ${WITHOUT_DEMO:-all}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./addons:/mnt/extra-addons:ro
      # IMPORTANT: must point at the same filestore volume as the public `odoo`
      # service. mgmt and public share Postgres, so ir.attachment rows reference
      # files in this directory — split mounts produce 404s on assets and the
      # "CSS error, using old style" fallback in the browser.
      - ./data/odoo-filestore:/var/lib/odoo
    # wkhtmltopdf fetches PDF header/footer via callback to the URL stored in
    # ir.config_parameter `report.url`, which must use the tenant DB name as
    # hostname so it satisfies the public odoo's `dbfilter = ^%d$`. Resolve
    # those hostnames to loopback inside this container so the callback hits
    # this same Odoo (mgmt's `dbfilter = ^.*$` accepts any).
    extra_hosts:
      - "erp_dev_aimarka:127.0.0.1"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8069/web/database/selector', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Loopback port for admin access without going through Caddy (SSH tunnel:
    # ssh -L 18079:127.0.0.1:18079 <host>). Keep the 127.0.0.1 binding — it is
    # not what protects the manager any more (Caddy fronts this instance on the
    # {$DOMAIN} host, see the note above), but it keeps this direct port off the
    # LAN. The default 18079 is overrideable via ODOO_MGMT_PORT in .env.
    ports:
      - "127.0.0.1:${ODOO_MGMT_PORT:-18079}:8069"
    networks: [odoo-net]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Front-door Odoo: the instance every human logs into through Caddy.
  #
  # Why it exists as a THIRD instance rather than reusing one of the other two:
  #   - the public `odoo` runs dbfilter = ^%d$ (a hostname may only reach the DB
  #     of the same name). Neither front-door host is named after a database, so
  #     it can serve none of them there.
  #   - `odoo-mgmt` can serve all of them, but only because it also runs
  #     LIST_DB=True, i.e. it hands out the database manager and the full list of
  #     tenant DBs to anyone who asks. That is exactly what we are hiding.
  # So: same dbfilter as mgmt, WITHOUT the database manager. The DB for a browser
  # session is chosen by the login-gateway (see login-gateway/README.md), which
  # bootstraps `session.db` server-side and hands the cookie to the browser; the
  # tenant DB name never reaches the client.
  odoo-front:
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo-front
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      CORETAX_SERTEL_MASTER_KEY: ${CORETAX_SERTEL_MASTER_KEY:-}
      # Unlike odoo-mgmt (WORKERS=0, admin work only) this one carries real
      # end-user traffic, so it needs prefork workers.
      WORKERS: ${ODOO_FRONT_WORKERS:-4}
      # MUST be 0, and SERVER_WIDE_MODULES MUST stay base,web — same reasons as
      # spelled out on odoo-mgmt above: a second cron thread cross-invalidates
      # the shared registry, and a second queue_job runner makes BOTH runners
      # lose the per-database advisory lock, after which no job runs in any DB.
      MAX_CRON_THREADS: "0"
      SERVER_WIDE_MODULES: "base,web"
      # The whole point of this instance: serve any tenant DB, list none of them.
      # With LIST_DB=False Odoo refuses /web/database/* outright, so even if a
      # Caddy rule is lost the manager does not come back.
      LIST_DB: "False"
      DBFILTER: "^.*$$"
      # Caddy terminates TLS in front; without proxy_mode Odoo builds redirects
      # from the internal http:// hop and bounces the browser out of https.
      PROXY_MODE: "True"
      WITHOUT_DEMO: ${WITHOUT_DEMO:-all}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./addons:/mnt/extra-addons:ro
      # Same filestore as `odoo` and `odoo-mgmt` — they share Postgres, so
      # ir.attachment rows point at files in this directory. A split mount
      # serves 404s on assets and the "CSS error, using old style" fallback.
      - ./data/odoo-filestore:/var/lib/odoo
    extra_hosts:
      - "erp_dev_aimarka:127.0.0.1"
    healthcheck:
      # NOT /web/database/selector (odoo-mgmt's probe): with LIST_DB=False that
      # route is gone. /web/health is auth='none', db-less and always 200.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8069/web/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    # No `ports:`. Reachable only from inside odoo-net, via Caddy.
    networks: [odoo-net]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # The gateway is only useful once odoo-front exists, which is here.
  login-gateway:
    depends_on:
      odoo-front:
        condition: service_healthy

  # Re-point the orchestrator at the private management Odoo.
  #
  # Docker socket is mounted read-only so the orchestrator can `docker exec`
  # the ``odoo`` CLI inside the ``odoo-mgmt`` container to initialise newly
  # provisioned tenant databases. /web/database/create cannot be relied on
  # because it returns HTTP 200 even when the underlying ``-i base`` step
  # fails — the CLI surfaces those errors deterministically.
  #
  # SECURITY: docker socket access is root-equivalent on the host. Acceptable
  # for the orchestrator (which already has CREATEDB on postgres and writes
  # encrypted secrets) but the orchestrator MUST stay on an isolated network
  # and not be publicly reachable. Hardening path is a sidecar in odoo-mgmt
  # exposing an HMAC-authenticated /init endpoint — tracked separately.
  tenant-orchestrator:
    # Override base read_only so docker socket reads work
    read_only: false
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      odoo-mgmt:
        condition: service_healthy
    environment:
      ODOO_HOST: odoo-mgmt
      ODOO_MGMT_CONTAINER: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo-mgmt
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # File Browser — the web UI over /srv/sftp-share/files, used to hand
  # documents to clients (the catalogue lives there; see publish.sh).
  #
  # This service existed on the host for months as a hand-typed `docker run`
  # with no definition anywhere in the repo: a rebuild of the host would have
  # lost it, and nobody could have said how it had been configured. What is
  # below is that container, transcribed, plus the fix for why it spent two
  # weeks reporting `unhealthy`.
  #
  # It reports healthy only if BOTH of these hold:
  #
  #   * FB_PORT / FB_ADDRESS are set. The image's /healthcheck.sh otherwise
  #     digs the port out of /config/settings.json, and with an empty result
  #     calls `wget: bad port ''` and fails forever.
  #   * /config is writable by the runtime uid. The entrypoint seeds
  #     settings.json there on boot; when it cannot, the file never appears —
  #     which is what emptied the port above. The host directory must be
  #     owned by 1002:1002 (sftpshare), the same uid the share itself uses:
  #
  #         mkdir -p data/filebrowser-config
  #         chown 1002:1002 data/filebrowser-config
  #
  # Runs as sftpshare so files it writes into the share carry the ownership
  # the SFTP chroot expects, rather than root's.
  filebrowser:
    image: filebrowser/filebrowser:v2
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-filebrowser
    restart: unless-stopped
    user: "1002:1002"
    command:
      - -d
      - /db/filebrowser.db
      - -r
      - /srv
      - -b
      - /files
      - -a
      - 0.0.0.0
      - -p
      - "80"
    environment:
      UID: "1000"
      GID: "1000"
      FB_PORT: "80"
      FB_ADDRESS: localhost
    volumes:
      - /srv/sftp-share/files:/srv
      - ./data/filebrowser:/db
      - ./data/filebrowser-config:/config
    networks:
      - odoo-net
