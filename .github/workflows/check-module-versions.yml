name: Module Versions Drift Check

# login-gateway/config/versions.json is generated from the addon manifests, so a
# manifest version bump that does not regenerate it leaves eal-hub.erajaya.com
# /signin/versi advertising a version that is no longer deployed. Same contract
# as the MODULE_KNOWLEDGE drift check next door.

on:
  pull_request:
    paths:
      - 'addons/**/__manifest__.py'
      - 'login-gateway/config/versions.json'
      - 'scripts/gen_module_versions.py'
      - 'odoo/Dockerfile'

jobs:
  versions-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The generator reads `git log` per module, so a shallow clone would
          # produce an empty history and report drift on every module.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check versions.json is current
        run: python scripts/gen_module_versions.py --check
