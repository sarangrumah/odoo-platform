name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  id-token: write  # for cosign keyless

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  sast-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep==1.168.0
      # Runs p/python + p/owasp-top-ten (registry) + our local Odoo rules over the
      # whole repo (full scan, not diff — the deprecated semgrep-action@v1 only
      # scanned .semgrep/ and skipped the registry rulesets). `--error` fails CI on
      # ANY finding. Two nginx rules are excluded repo-wide: our reverse proxy uses
      # variable upstreams (Docker DNS re-resolution) and forwards the client Host
      # by design — both are reviewed, intentional idioms, not per-config bugs.
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config .semgrep/odoo-rules.yml \
            --error --metrics off \
            --exclude-rule generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used

  sca-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install pip-audit
        run: pip install pip-audit cyclonedx-bom
      - name: Audit odoo requirements
        run: pip-audit -r odoo/requirements.txt --strict
      - name: Audit ai-gateway deps
        run: pip-audit -r <(pip-compile --no-emit-index-url ai-gateway/pyproject.toml -o /dev/stdout 2>/dev/null || echo "")
        continue-on-error: true
      - name: Generate SBOMs
        run: |
          cyclonedx-py environment -o sbom-odoo.json --of JSON || true
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sboms
          path: sbom-*.json

  # tenant-orchestrator ships tests but nothing ran them, so regressions in the
  # one service that holds docker.sock and SSHes into tenant VPSes were caught
  # by nobody. Odoo addon tests need a live Postgres + Odoo and stay out of CI;
  # these are plain pytest and have no such excuse.
  orchestrator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # Mirrors the runtime deps pinned in tenant-orchestrator/Dockerfile plus
      # pytest. Keep in step with that list — the image installs them inline
      # rather than from a requirements file.
      - name: Install deps
        run: |
          pip install pytest \
            fastapi uvicorn[standard] "pydantic[email]" pydantic-settings \
            httpx[http2] "psycopg[binary,pool]" cryptography bcrypt passlib \
            boto3 structlog prometheus-client croniter apscheduler paramiko
      - name: Run tests
        working-directory: tenant-orchestrator
        run: python -m pytest tests/ -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      # Every Dockerfile in the repo is listed here. It used to be odoo,
      # ai-gateway and custom-predictor only, which left 6 images built and
      # shipped but never scanned — that is how tenant-orchestrator sat 4 majors
      # behind on cryptography (#78) and how DL3018 hid from container-scan (#80).
      # `dir` is the build context, `name` is the job label and image tag, since
      # some contexts are nested and would make ugly tags.
      #
      # `smoke` (optional) is a Python one-liner run inside the built image. It
      # exists because scanning an image says nothing about whether it still
      # works: cryptography 50 landed in #74 and broke the pyOpenSSL the base
      # image ships, which made every Odoo route answer 404 — while trivy,
      # hadolint and sca-python all stayed green and the container still logged
      # "HTTP service (werkzeug) running" (#89). Importing the web controllers
      # walks the chain that broke (web -> base.ir_mail_server -> OpenSSL) and
      # costs a couple of seconds. `odoo --version` is NOT a substitute: it
      # exits before any module is loaded.
      matrix:
        include:
          - {name: odoo, dir: odoo, smoke: "import odoo.addons.web.controllers.database"}
          - {name: ai-gateway, dir: ai-gateway}
          - {name: custom-predictor, dir: custom-predictor}
          - {name: hub-portal, dir: hub-portal}
          - {name: storefront, dir: storefront}
          - {name: tenant-orchestrator, dir: tenant-orchestrator}
          - {name: baileys, dir: services/baileys}
          - {name: finance-sap-bridge, dir: services/finance-sap-bridge}
          - {name: odoo-exporter, dir: observability/odoo-exporter}
          # The front-door TLS terminator. It used to be the upstream caddy image
          # and therefore nobody's to scan; since it carries our own Go build of
          # Caddy plus the WAF and rate-limit plugins, a dependency CVE in it is
          # ours. The first build of that image shipped 20 HIGH/CRITICAL findings
          # (Caddy 2.11.3 itself, x/crypto, x/net, grpc, go-jose, Go stdlib), which
          # is exactly what this entry is here to catch next time.
          - {name: caddy, dir: caddy}
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build image
        run: |
          docker build -t local-${{ matrix.name }}:ci ./${{ matrix.dir }}
      # Values come from the matrix literal above, not from anything a PR author
      # controls, but they are passed through env rather than interpolated into
      # the shell so the pattern stays clean for semgrep and for whoever adds
      # the next smoke command.
      - name: Smoke-import the image
        if: matrix.smoke != ''
        env:
          IMAGE: local-${{ matrix.name }}:ci
          SMOKE: ${{ matrix.smoke }}
        run: docker run --rm --entrypoint python3 "$IMAGE" -c "$SMOKE"
      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dir }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local-${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          # Package-level suppressions live in Rego because .trivyignore can
          # only match vulnerability IDs. See the file for the justification.
          ignore-policy: .trivy/ignore-policy.rego

  fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

  sign-images:
    runs-on: ubuntu-latest
    needs: [container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Cosign sign keyless (placeholder)
        run: echo "Configure registry login and replace this step with real cosign sign --yes <ref>"
