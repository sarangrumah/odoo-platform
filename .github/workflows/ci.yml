name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  id-token: write  # for cosign keyless

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  sast-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep==1.168.0
      # Runs p/python + p/owasp-top-ten (registry) + our local Odoo rules over the
      # whole repo (full scan, not diff — the deprecated semgrep-action@v1 only
      # scanned .semgrep/ and skipped the registry rulesets). `--error` fails CI on
      # ANY finding. Two nginx rules are excluded repo-wide: our reverse proxy uses
      # variable upstreams (Docker DNS re-resolution) and forwards the client Host
      # by design — both are reviewed, intentional idioms, not per-config bugs.
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/python \
            --config p/owasp-top-ten \
            --config .semgrep/odoo-rules.yml \
            --error --metrics off \
            --exclude-rule generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host \
            --exclude-rule generic.nginx.security.request-host-used.request-host-used

  sca-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Install pip-audit
        run: pip install pip-audit cyclonedx-bom
      - name: Audit odoo requirements
        run: pip-audit -r odoo/requirements.txt --strict
      - name: Audit ai-gateway deps
        run: pip-audit -r <(pip-compile --no-emit-index-url ai-gateway/pyproject.toml -o /dev/stdout 2>/dev/null || echo "")
        continue-on-error: true
      - name: Generate SBOMs
        run: |
          cyclonedx-py environment -o sbom-odoo.json --of JSON || true
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sboms
          path: sbom-*.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [odoo, ai-gateway, custom-predictor]
      fail-fast: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build image
        run: |
          docker build -t local-${{ matrix.image }}:ci ./${{ matrix.image }}
      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.image }}/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local-${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  fs-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

  sign-images:
    runs-on: ubuntu-latest
    needs: [container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
      - name: Cosign sign keyless (placeholder)
        run: echo "Configure registry login and replace this step with real cosign sign --yes <ref>"
