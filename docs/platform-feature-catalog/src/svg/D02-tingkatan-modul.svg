<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Calibri, Carlito, sans-serif">
<style>
 .lbl{font-size:14px;fill:#1A2332;font-weight:bold}
 .sm{font-size:11.5px;fill:#4A5568}
 .num{font-size:22px;fill:#714B67;font-weight:bold}
 .numw{font-size:22px;fill:#FFFFFF;font-weight:bold}
 .lblw{font-size:14px;fill:#FFFFFF;font-weight:bold}
 .smw{font-size:11.5px;fill:#E8E0E7}
 .cap{font-size:12px;fill:#714B67;font-weight:bold;letter-spacing:.04em}
 .box{fill:#FFFFFF;stroke:#C9B8C6;stroke-width:1.4}
 .lila{fill:#E8E0E7;stroke:#C9B8C6;stroke-width:1.4}
 .plum{fill:#714B67;stroke:#714B67}
 .arrow{stroke:#714B67;stroke-width:2;fill:none;marker-end:url(#b)}
</style>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
 orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#714B67"/></marker></defs>
<rect x="0" y="0" width="900" height="430" fill="#FFFFFF"/>
<text class="cap" x="40" y="28">SEMAKIN KE ATAS, SEMAKIN SEDIKIT TENANT YANG TERSENTUH</text>
<rect class="plum" x="250" y="44" width="400" height="52" rx="6"/>
<text class="numw" x="278" y="80.0" text-anchor="middle">10</text>
<text class="lblw" x="310" y="68.0">_tenants/ — satu pelanggan</text>
<text class="smw" x="310" y="86.0">saldo awal · penomoran · aturan satu entitas</text>
<rect class="lila" x="190" y="106" width="520" height="52" rx="6"/>
<text class="num" x="218" y="142.0" text-anchor="middle">14</text>
<text class="lbl" x="250" y="130.0">verticals/ — satu industri</text>
<text class="sm" x="250" y="148.0">PPOB / VAS · F&B ESB · template</text>
<rect class="box" x="90" y="168" width="720" height="60" rx="6"/>
<text class="num" x="118" y="208.0" text-anchor="middle">103</text>
<text class="lbl" x="150" y="196.0">ee_gap/ — semua tenant</text>
<text class="sm" x="150" y="214.0">selisih Community → Enterprise: akuntansi · payroll · gudang · retail · portal keuangan</text>
<rect class="box" x="90" y="238" width="350" height="52" rx="6"/>
<text class="num" x="118" y="274.0" text-anchor="middle">9</text>
<text class="lbl" x="150" y="262.0">compliance/ — semua tenant ID</text>
<text class="sm" x="150" y="280.0">UU PDP 27/2022 · Coretax · PPh</text>
<rect class="box" x="460" y="238" width="350" height="52" rx="6"/>
<text class="num" x="488" y="274.0" text-anchor="middle">7</text>
<text class="lbl" x="520" y="262.0">control_plane/ + operations/</text>
<text class="sm" x="520" y="280.0">lapisan kendali — melayani operator</text>
<rect class="box" x="90" y="300" width="350" height="52" rx="6"/>
<text class="num" x="118" y="336.0" text-anchor="middle">9</text>
<text class="lbl" x="150" y="324.0">core/ — fondasi</text>
<text class="sm" x="150" y="342.0">HMAC · adapter · BAST · HHT · barcode</text>
<rect class="box" x="460" y="300" width="350" height="52" rx="6"/>
<text class="num" x="488" y="336.0" text-anchor="middle">4</text>
<text class="lbl" x="520" y="324.0">_vendor/ — pihak ketiga</text>
<text class="sm" x="520" y="342.0">OCA: queue_job · auth_jwt · lainnya</text>
<path class="arrow" d="M868 330 L868 80"/>
<text class="sm" x="856" y="210" text-anchor="middle" transform="rotate(-90 856 210)">promosi bila muncul untuk pelanggan kedua</text>
<text class="sm" x="40" y="392">Tingkat ditentukan semata-mata oleh direktori tempat modul berada. Kategori di dalam manifest bukan penentu tingkat.</text>
<text class="sm" x="40" y="410">Total 156 modul. Mesin bersama tidak boleh masuk _tenants/, seberapa pun jelas ia diminta satu pelanggan.</text>
</svg>
