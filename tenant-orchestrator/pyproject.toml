[project]
name = "tenant-orchestrator"
version = "0.1.0"
description = "Multi-tenant lifecycle service for the Odoo 19 Platform"
requires-python = ">=3.12"
dependencies = [
  # fastapi 0.115.4 capped starlette at <0.42.0, stranding us on a starlette with
  # CVE-2025-62727. Clearing that alone was not enough — 0.49.1 still carries
  # CVE-2026-48818 (SSRF via UNC paths in StaticFiles) and CVE-2026-54283
  # (form() size limits ignored), both fixed only in the 1.x line. So starlette
  # goes to 1.3.1, and fastapi to the current release, whose floor
  # (starlette>=0.46.0, no ceiling) admits it. pydantic 2.9.2 satisfies >=2.9.0.
  # Both are pinned exactly so resolution cannot drift back below the fixes.
  "fastapi==0.141.1",
  "starlette==1.3.1",  # CVE-2025-62727, CVE-2026-48818, CVE-2026-54283
  "uvicorn[standard]==0.32.0",
  "pydantic[email]==2.9.2",
  "pydantic-settings==2.6.0",
  "httpx[http2]==0.27.2",
  "psycopg[binary,pool]==3.2.3",
  "cryptography==50.0.0",  # 50.0 clears CVE-2026-69247/69248/69249; crypto.py uses only Fernet/InvalidToken
  "bcrypt==4.2.0",
  "passlib==1.7.4",  # dbops.py hashes Odoo passwords with pbkdf2_sha512
  "boto3==1.35.54",
  "structlog==24.4.0",
  "prometheus-client==0.21.0",
  "croniter==3.0.4",
  "apscheduler==3.10.4",
  "paramiko==5.0.0",  # 5.0 clears CVE-2026-44405 (SHA-1/ssh-rsa); provisioner_ssh uses SSHClient/Ed25519Key/RSAKey/AutoAddPolicy — unchanged in 5.x
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "responses==0.25.3",
  "ruff==0.7.2",
  "mypy==1.13.0",
  "moto[s3]==5.0.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Declared explicitly: setuptools' auto-discovery trips over the flat layout
# (app/, tests/ and bootstrap_templates/ all look like top-level packages) and
# refuses to build. The Dockerfile installs from this file — this is what makes
# `pip install .` work, and what keeps the dependency list in one place instead
# of duplicated inline in the Dockerfile, where it had already drifted.
[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "TCH", "ASYNC"]
ignore = [
  "S101",     # assert allowed in tests and defensive checks
  "S608",     # SQL composition is parameterised via psycopg3, not string-concatenated
  "S108",     # /tmp paths are intentional in bootstrap-template handling
  "S310",     # URL open uses validated/HTTPS-only targets (Odoo / S3)
  "S603",     # subprocess args are controlled (no shell injection surface)
  "B904",     # raise-without-from not always desired
  "TC001",    # typing-only-first-party imports
  "TC003",    # typing-only-stdlib imports
  "F841",     # unused-locals tracked separately for review (see issue followup)
  "E402",     # one intentional late import (TYPE_CHECKING-style guard)
  "E741",     # one allowed ambiguous name
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
