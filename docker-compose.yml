# ============================================================
# Odoo 19 Platform — base compose
# Services: postgres, redis, odoo, ai-gateway
# Always run with at least one override (dev/prod) — this base
# alone has no host port binding for postgres/redis (security default).
# ============================================================

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-security-baseline: &security-baseline
  security_opt:
    - no-new-privileges:true

services:

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-postgres
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Consumed by 05-rotate-orchestrator-password.sh on first boot only.
      PG_ORCHESTRATOR_PASSWORD: ${PG_ORCHESTRATOR_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
      - "-c"
      - "password_encryption=scram-sha-256"
      # Sized against this container's 4 GiB limit (host has 15 GiB).
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 4g

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-redis
    <<: [*restart-policy, *default-logging, *security-baseline]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 1.5g

  odoo:
    build:
      context: ./odoo
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # DB
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Odoo
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      WORKERS: ${WORKERS:-0}
      MAX_CRON_THREADS: ${MAX_CRON_THREADS:-2}
      LIST_DB: ${LIST_DB:-False}
      WITHOUT_DEMO: ${WITHOUT_DEMO:-all}
      LIMIT_TIME_CPU: ${LIMIT_TIME_CPU:-600}
      LIMIT_TIME_REAL: ${LIMIT_TIME_REAL:-1200}
      LIMIT_MEMORY_SOFT: ${LIMIT_MEMORY_SOFT:-2147483648}
      LIMIT_MEMORY_HARD: ${LIMIT_MEMORY_HARD:-2684354560}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROXY_MODE: ${PROXY_MODE:-True}
      DBFILTER: ${DBFILTER:-^.*$$}
      SERVER_WIDE_MODULES: ${SERVER_WIDE_MODULES:-base,web}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Retail import: IMAP mailbox that receives the nightly Levi's X-center reports.
      # Read by retail.import.mailbox._password(); keeps the secret out of the database.
      LEVIS_MAIL_PASSWORD: ${LEVIS_MAIL_PASSWORD:-}
      # AI gateway
      AI_GATEWAY_URL: http://ai-gateway:8080
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      # Tenant orchestrator (custom_super_admin client signs /v1/* with this)
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET}
      # Coretax
      CORETAX_SERTEL_MASTER_KEY: ${CORETAX_SERTEL_MASTER_KEY}
      # Baileys (custom_whatsapp pre-fill defaults on whatsapp.account)
      BAILEYS_INTERNAL_URL: ${BAILEYS_INTERNAL_URL:-http://baileys:8088}
      BAILEYS_SHARED_SECRET: ${BAILEYS_SHARED_SECRET:-}
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./data/odoo-filestore:/var/lib/odoo
      # The SFTP share IS the drop folder: custom_retail_import's local feed reads
      # /mnt/data_levis/data and archives to /mnt/data_levis/archive, and the
      # retail.import.mailbox IMAP bridge backs up to /mnt/data_levis/mailbox.
      #
      # Must be /srv/sftp-share/files, not ./data/data_levis. The latter resolves to
      # an empty, root-owned directory the odoo uid cannot write, which silently
      # breaks both the mailbox and every retail.import.feed -- diagnosed and fixed
      # on the runtime host 2026-07-24, but the fix never came back to this file.
      - /srv/sftp-share/files:/mnt/data_levis
    extra_hosts:
      - "erp_dev_aimarka:127.0.0.1"
    ports:
      # Loopback only. Nothing on the ingress path uses this host port -- Caddy
      # proxies to nginx:443 and nginx has `upstream odoo_app { server odoo:8069; }`,
      # both by container name over odoo-net. Published on 0.0.0.0 it exposed an
      # instance running list_db=true with dbfilter=^.*$$ (every tenant database
      # selectable from its login page) to the whole LAN. ufw cannot gate this:
      # Docker DNATs in nat PREROUTING, before filter INPUT.
      - "127.0.0.1:${ODOO_HTTP_PORT:-18069}:8069"
      - "${ODOO_LONGPOLL_PORT:-18072}:8072"
    healthcheck:
      test: ["CMD", "/usr/local/bin/custom-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 4g

  ai-gateway:
    build:
      context: ./ai-gateway
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-ai-gateway:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-ai-gateway
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=128m,mode=1777
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL_DEFAULT: ${AI_MODEL_DEFAULT:-claude-sonnet-4-6}
      AI_MODEL_QUALITY: ${AI_MODEL_QUALITY:-claude-opus-4-7}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL_DEFAULT: ${OPENAI_MODEL_DEFAULT:-gpt-4o}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL_DEFAULT: ${OLLAMA_MODEL_DEFAULT:-llama3.2}
      OLLAMA_MODEL_QUALITY: ${OLLAMA_MODEL_QUALITY:-qwen2.5:7b}
      # Upstream Ollama read timeout (s) and context window. Raise for large
      # batch/summarization prompts on CPU-only hosts (e.g. knowledge gen).
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      # Personal shopper (retrieval-controlled, runs on local Ollama)
      AI_MODEL_SHOPPER: ${AI_MODEL_SHOPPER:-qwen2.5:7b}
      ODOO_STOREFRONT_URL: ${ODOO_STOREFRONT_URL:-http://odoo:8069}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${AI_GATEWAY_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 1g

  minio:
    image: minio/minio:RELEASE.2024-10-29T16-01-48Z
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-minio
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS:-platform-backups}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-19001}
      # Enables SSE-S3 (AES256) requested by the orchestrator backup uploads.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    volumes:
      - ./data/minio:/data
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 1g

  tenant-orchestrator:
    build:
      context: ./tenant-orchestrator
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-tenant-orchestrator:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-tenant-orchestrator
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      odoo:
        condition: service_healthy
    environment:
      # --- Postgres master + roles ---
      PG_HOST: postgres
      PG_PORT: 5432
      PG_MASTER_DB: ${POSTGRES_DB:-postgres}
      PG_SUPER_USER: ${POSTGRES_USER:-odoo}
      PG_SUPER_PASSWORD: ${POSTGRES_PASSWORD}
      PG_ORCHESTRATOR_USER: tenant_orchestrator
      PG_ORCHESTRATOR_PASSWORD: ${PG_ORCHESTRATOR_PASSWORD}
      PG_TENANT_OWNER_ROLE: ${POSTGRES_USER:-odoo}
      # --- Cryptography ---
      MASTER_WRAPPING_KEY: ${MASTER_WRAPPING_KEY}
      # --- API auth ---
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET}
      # --- MinIO / S3 ---
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${MINIO_DEFAULT_BUCKETS:-platform-backups}
      S3_USE_SSL: "false"
      # --- Odoo ---
      ODOO_HOST: odoo
      ODOO_PORT: 8069
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      # --- Odoo Mgmt (for intake/journey bridge from /v1/intake/*) ---
      ODOO_MGMT_URL: http://odoo-mgmt:8069
      ODOO_MGMT_DB: ${ORCHESTRATOR_ODOO_MGMT_DB:-landing_demo}
      ODOO_MGMT_USER: ${ORCHESTRATOR_ODOO_MGMT_USER:-am.ademaryadi@gmail.com}
      ODOO_MGMT_PASSWORD: ${ORCHESTRATOR_ODOO_MGMT_PASSWORD:-admin}
      # --- Operational ---
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_BACKUP_SCHEDULER: ${ENABLE_BACKUP_SCHEDULER:-true}
      # --- Alerting: WhatsApp via baileys on backup failure ---
      ALERT_WHATSAPP_ENABLED: ${ALERT_WHATSAPP_ENABLED:-false}
      BAILEYS_URL: ${BAILEYS_URL:-http://baileys:8088}
      BAILEYS_SHARED_SECRET: ${BAILEYS_SHARED_SECRET:-}
      ALERT_WHATSAPP_SESSION: ${ALERT_WHATSAPP_SESSION:-acct-2}
      ALERT_WHATSAPP_TO: ${ALERT_WHATSAPP_TO:-}
      # --- Demo / UAT friendliness ---
      # When true, SSH-dependent VPS actions return a stub success response
      # instead of attempting a real connection. Leave false in prod.
      PLATFORM_DEMO_MODE: ${PLATFORM_DEMO_MODE:-false}
      # --- Optional integrations (blank = degrade gracefully) ---
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      # --- Vault (vault:// ssh credential refs); blank disables resolver ---
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      # --- SSH host-key pinning ---
      # Keys are learned on first connect and verified afterwards, so a VPS
      # that changes identity is refused. Set SSH_STRICT_HOST_KEYS=true once
      # every VPS has been seen (or known_hosts is pre-seeded) to also refuse
      # first-sight hosts.
      SSH_KNOWN_HOSTS_FILE: ${SSH_KNOWN_HOSTS_FILE:-/var/lib/orchestrator/known_hosts}
      SSH_STRICT_HOST_KEYS: ${SSH_STRICT_HOST_KEYS:-false}
    volumes:
      # The container is read_only, so the pinned host keys need a real mount
      # or they cannot be written at all — and pinning would silently no-op.
      - ./data/orchestrator:/var/lib/orchestrator
    ports:
      - "${TENANT_ORCHESTRATOR_PORT:-18091}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 1g

  baileys:
    build:
      context: ./services/baileys
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-baileys:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-baileys
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      PORT: 8088
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BAILEYS_AUTH_DIR: /var/lib/baileys
      BAILEYS_SHARED_SECRET: ${BAILEYS_SHARED_SECRET}
      # Where Baileys posts inbound + delivery events. Defaults to the
      # internal Odoo service URL; override in .env for multi-tenant
      # routing (e.g. when each tenant has its own Odoo mgmt instance).
      ODOO_WEBHOOK_BASE: ${BAILEYS_ODOO_WEBHOOK_BASE:-http://odoo:8069}
      # Which tenant database owns whatsapp.account. REQUIRED here, because this
      # Odoo runs dbfilter = ^.*$$ over ~24 databases: without it Odoo cannot
      # resolve a database for an anonymous POST and answers 404 "No database is
      # selected", which looks like a missing route. Sent as X-Odoo-Database
      # (Odoo 19 does not honour ?db=).
      ODOO_WEBHOOK_DB: ${BAILEYS_ODOO_WEBHOOK_DB:-}
    volumes:
      - ./data/baileys:/var/lib/baileys
    ports:
      - "${BAILEYS_PORT:-18088}:8088"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 512m

  hub-portal:
    build:
      context: ./hub-portal
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-hub-portal:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-hub-portal
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    depends_on:
      tenant-orchestrator:
        condition: service_healthy
    environment:
      PORT: 8080
      ORCHESTRATOR_URL: http://tenant-orchestrator:8080
      ORCHESTRATOR_BASE_URL: http://tenant-orchestrator:8080
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET}
      HUB_PORTAL_ACTOR: hub-portal
      # Default targets odoo-mgmt (only present with the multitenant overlay).
      # In single-tenant deployments without that overlay, override to
      # http://odoo:8069 via HUB_PORTAL_ODOO_BASE_URL in .env.
      ODOO_BASE_URL: ${HUB_PORTAL_ODOO_BASE_URL:-http://odoo-mgmt:8069}
      ODOO_DB: ${HUB_PORTAL_ODOO_DB:-landing_demo}
      ODOO_LOGIN: ${HUB_PORTAL_ODOO_LOGIN:-am.ademaryadi@gmail.com}
      ODOO_PASSWORD: ${HUB_PORTAL_ODOO_PASSWORD:-admin}
      NODE_ENV: production
    ports:
      - "${HUB_PORTAL_PORT:-18000}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 512m

  # ---- Gentle Woman headless storefront (Next.js) ----
  # Talks to Odoo as the commerce backend via custom_storefront_api. The BFF
  # holds the HMAC secret + tenant Host header; the browser never sees them.
  storefront:
    build:
      context: ./storefront
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-storefront:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-storefront
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /app/.next/cache:rw,size=128m
    depends_on:
      odoo:
        condition: service_healthy
    volumes:
      # Pin the internal nginx TLS cert so the BFF→Odoo hop runs over TLS.
      - ./nginx/certs/server.crt:/etc/ssl/odoo-internal.crt:ro
    environment:
      PORT: 8080
      NODE_ENV: production
      # BFF→Odoo rides the internal nginx TLS terminator (encrypted hop).
      ODOO_BASE_URL: ${STOREFRONT_ODOO_BASE_URL:-https://nginx}
      ODOO_INTERNAL_CA: /etc/ssl/odoo-internal.crt
      ODOO_TENANT_DB: ${STOREFRONT_TENANT_DB:-gentle_woman}
      ODOO_TENANT_HOST: ${STOREFRONT_TENANT_HOST:-gentle_woman.platform.localhost}
      STOREFRONT_HMAC_SECRET: ${STOREFRONT_HMAC_SECRET}
      # AI personal shopper BFF → ai-gateway (HMAC-signed; secret stays server-side)
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-http://ai-gateway:8080}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      NEXT_PUBLIC_ODOO_PUBLIC_URL: ${STOREFRONT_PUBLIC_ODOO_URL:-https://gentle_woman.platform.localhost}
      NEXT_PUBLIC_SITE_NAME: ${STOREFRONT_SITE_NAME:-Gentlewoman}
      NEXT_PUBLIC_CURRENCY: ${STOREFRONT_CURRENCY:-IDR}
      NEXT_PUBLIC_SOCIAL_WHATSAPP: ${STOREFRONT_SOCIAL_WHATSAPP:-}
    ports:
      - "${STOREFRONT_PORT:-18100}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 512m

  # Dedicated TLS sidecar for the BFF→Odoo hop (encrypts the one internal hop
  # that carried JWT+PII in cleartext). Pure TLS termination → odoo:8069, none
  # of the shared nginx's Odoo-web tuning. Storefront pins this cert.
  storefront-tls:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-storefront-tls
    <<: [*restart-policy, *default-logging]
    depends_on:
      odoo:
        condition: service_healthy
    volumes:
      - ./nginx/storefront-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/certs:ro
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 64m

  # ---- FTPS drop server (pure-ftpd, explicit TLS) ----
  # Partner pushes retail source files (X20/X24/X70D/...) over explicit FTPS.
  # The FTP user is chrooted to /home/data_levis/data (the upload folder); the
  # sibling archive/ lives outside the chroot and is written only by Odoo, which
  # shares the same ./data/data_levis host volume (see the odoo service above).
  ftps:
    image: stilliard/pure-ftpd:hardened
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-ftps
    <<: [*restart-policy, *default-logging, *security-baseline]
    environment:
      PUBLICHOST: ${FTPS_PUBLICHOST:-127.0.0.1}        # advertised host for passive mode
      FTP_USER_NAME: ${FTPS_USER:-levis}
      FTP_USER_PASS: ${FTPS_PASS}                       # required (secret, no default)
      FTP_USER_HOME: /home/data_levis/data              # chroot = data/ only
      # pure-ftpd wants the passive range in colon form (min:max).
      FTP_PASSIVE_PORTS: "${FTPS_PASSIVE_MIN:-30000}:${FTPS_PASSIVE_MAX:-30009}"
      # --tls=2 => require explicit FTPS (AUTH TLS). -U 177:000 => umask: files 666 / dirs 777
      # so the Odoo container (different uid) can read uploads and move them to archive/.
      ADDED_FLAGS: "--tls=2 -U 177:000"
      # Self-signed cert auto-generated on first boot when no PEM is mounted.
      TLS_CN: ${FTPS_PUBLICHOST:-localhost}
      TLS_ORG: ${FTPS_TLS_ORG:-Platform}
      TLS_C: ${FTPS_TLS_C:-ID}
    volumes:
      - ./data/data_levis:/home/data_levis             # shared with Odoo (drop + archive)
      # Optional: reuse the platform TLS cert instead of the self-signed one. Build a
      # combined PEM once (cat server.key server.crt > data/data_levis/.ftps/pure-ftpd.pem)
      # then uncomment:
      # - ./data/data_levis/.ftps/pure-ftpd.pem:/etc/ssl/private/pure-ftpd.pem:ro
    ports:
      - "${FTPS_PORT:-21}:21"
      # Docker wants the published range in dash form (min-max); must match
      # FTP_PASSIVE_PORTS above and the PUBLICHOST advertised to the client.
      - "${FTPS_PASSIVE_MIN:-30000}-${FTPS_PASSIVE_MAX:-30009}:${FTPS_PASSIVE_MIN:-30000}-${FTPS_PASSIVE_MAX:-30009}"
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 256m


  # ---- VAS PMO (Next.js headless UI + notification BFF) ----
  # Same shape as `storefront`: baked standalone image, read-only FS, BFF→Odoo over the
  # internal TLS terminator with the CA pinned. Odoo's notification outbox POSTs back to
  # this container at /api/notify (HMAC-signed), which is why it also needs the WA and
  # SMTP credentials.
  # Single-database Odoo listener for VAS PMO.
  #
  # The shared `odoo` service runs DBFILTER=^.*$$, so more than one database matches and
  # Odoo cannot pick one for an auth='public' route -- every /vaspmo/api/* call answers
  # 404. Changing DBFILTER on the shared service would change how every tenant resolves,
  # so this pins the filter on a listener of its own instead. Same image, same addons,
  # no published port: only the BFF talks to it, over the internal bridge.
  odoo-vaspmo:
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-odoo-vaspmo
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # DB
      HOST: postgres
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Odoo
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      WORKERS: ${WORKERS:-0}
      MAX_CRON_THREADS: 1
      LIST_DB: ${LIST_DB:-False}
      WITHOUT_DEMO: ${WITHOUT_DEMO:-all}
      LIMIT_TIME_CPU: ${LIMIT_TIME_CPU:-600}
      LIMIT_TIME_REAL: ${LIMIT_TIME_REAL:-1200}
      LIMIT_MEMORY_SOFT: ${LIMIT_MEMORY_SOFT:-2147483648}
      LIMIT_MEMORY_HARD: ${LIMIT_MEMORY_HARD:-2684354560}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROXY_MODE: ${PROXY_MODE:-True}
      DBFILTER: ^${VAS_PMO_TENANT_DB:-rnd_vas_pmo}$$
      # Pinned literal, NOT ${SERVER_WIDE_MODULES}. The .env value carries queue_job,
      # and DBFILTER does not apply to the job runner: this container would start a
      # SECOND runner over every database. The two runners then fight over the
      # per-database pg_try_advisory_lock, both lose the master election, and both
      # loop in initialize_databases forever -- no job runs anywhere. VAS PMO does
      # not use queue_job.
      SERVER_WIDE_MODULES: base,web
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Retail import: IMAP mailbox that receives the nightly Levi's X-center reports.
      # Read by retail.import.mailbox._password(); keeps the secret out of the database.
      LEVIS_MAIL_PASSWORD: ${LEVIS_MAIL_PASSWORD:-}
      # AI gateway
      AI_GATEWAY_URL: http://ai-gateway:8080
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      # Tenant orchestrator (custom_super_admin client signs /v1/* with this)
      ORCHESTRATOR_SHARED_SECRET: ${ORCHESTRATOR_SHARED_SECRET}
      # Coretax
      CORETAX_SERTEL_MASTER_KEY: ${CORETAX_SERTEL_MASTER_KEY}
      # Baileys (custom_whatsapp pre-fill defaults on whatsapp.account)
      BAILEYS_INTERNAL_URL: ${BAILEYS_INTERNAL_URL:-http://baileys:8088}
      BAILEYS_SHARED_SECRET: ${BAILEYS_SHARED_SECRET:-}
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - ./data/odoo-filestore:/var/lib/odoo
      # Shared drop folder: custom_retail_import local feed reads
      # /mnt/data_levis/data and archives to /mnt/data_levis/archive.
      # Mapped to the SFTP/File Browser share so nightly SFTP uploads and the
      # retail.import.mailbox IMAP bridge land in the same place the feed polls.
      - /srv/sftp-share/files:/mnt/data_levis
    extra_hosts:
      - "erp_dev_aimarka:127.0.0.1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/custom-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 2g

  vas-pmo:
    build:
      context: ./vas-pmo
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-vas-pmo:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-vas-pmo
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /app/.next/cache:rw,size=128m
    depends_on:
      odoo:
        condition: service_healthy
    volumes:
      # Pin the internal nginx TLS cert so the BFF→Odoo hop runs over TLS.
      - ./nginx/certs/server.crt:/etc/ssl/odoo-internal.crt:ro
    environment:
      PORT: 8080
      # Next's standalone server binds to $HOSTNAME, which docker sets to the container
      # id. Without this it listens on that name only and the healthcheck (127.0.0.1)
      # is refused.
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      ODOO_BASE_URL: ${VAS_PMO_ODOO_BASE_URL:-https://nginx}
      ODOO_INTERNAL_CA: /etc/ssl/odoo-internal.crt
      ODOO_TENANT_DB: ${VAS_PMO_TENANT_DB:-rnd_vas_pmo}
      ODOO_TENANT_HOST: ${VAS_PMO_TENANT_HOST:-}
      # Shared secret for BOTH directions: Odoo outbox → /api/notify, and BFF → Odoo
      # /vaspmo/api/hmac/*. Must equal ir.config_parameter
      # custom_core.secure_endpoint.vaspmo.secret.
      VAS_PMO_HMAC_SECRET: ${VAS_PMO_HMAC_SECRET}
      # WhatsApp: WaHub primary, the platform's baileys gateway as fallback.
      WA_PROVIDER: ${WA_PROVIDER:-wahub}
      WAHUB_API_URL: ${WAHUB_API_URL:-}
      WAHUB_APP_ID: ${WAHUB_APP_ID:-}
      WAHUB_APP_SECRET: ${WAHUB_APP_SECRET:-}
      BAILEYS_URL: ${VAS_PMO_BAILEYS_URL:-http://baileys:8088}
      BAILEYS_API_KEY: ${BAILEYS_API_KEY:-}
      # E-mail
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${VAS_PMO_MAIL_FROM:-VAS PMO <no-reply@vas-pmo.internal>}
      # Safety valve while onboarding: send everything to one tester instead of the team.
      NOTIFICATION_TEST_MODE: ${NOTIFICATION_TEST_MODE:-false}
      NOTIFICATION_TEST_PHONE: ${NOTIFICATION_TEST_PHONE:-}
      NOTIFICATION_TEST_EMAIL: ${NOTIFICATION_TEST_EMAIL:-}
    ports:
      - "${VAS_PMO_PORT:-18110}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/vaspmo/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 512m
  # Front-door tenant chooser. Replaces Odoo's database selector at the root of
  # the public hostnames: the user picks a vertical and an environment, this app
  # turns that into a database name server-side, bootstraps an Odoo session
  # already pinned to it, and hands the browser on to Odoo's own /web/login.
  # No database name ever reaches the client. See login-gateway/README.md.
  #
  # Depends on odoo-front, which only exists in docker-compose.multitenant.yml —
  # so the dependency is declared there, not here, to keep the base file usable
  # on its own.
  login-gateway:
    build:
      context: ./login-gateway
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-login-gateway:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-login-gateway
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /app/.next/cache:rw,size=64m
    volumes:
      # Bind-mounted over the copy baked into the image so publishing a new
      # environment is an edit + `docker compose restart`, not a rebuild. The
      # app re-reads the file per request, so even the restart is optional.
      - ./login-gateway/config:/app/config:ro
    environment:
      PORT: 8080
      # Next's standalone server binds to $HOSTNAME, which docker sets to the
      # container id. Without this it listens on that name only and the
      # healthcheck (127.0.0.1) is refused.
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      # Must be an Odoo whose dbfilter accepts every tenant DB. odoo-front is
      # the one — the public `odoo` runs ^%d$ and would refuse them all here.
      ODOO_FRONT_URL: ${LOGIN_GATEWAY_ODOO_URL:-http://odoo-front:8069}
      TENANTS_CONFIG_PATH: /app/config/tenants.json
      # Unlocks the environments marked `"visibility": "internal"` in
      # tenants.json, via /signin?staff=<key>. Leave EMPTY and they stay hidden
      # from everyone — the gateway fails closed.
      STAFF_KEY: ${LOGIN_GATEWAY_STAFF_KEY:-}
    ports:
      - "${LOGIN_GATEWAY_PORT:-18120}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/signin/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 256m

  # Levi's sales dashboard. Unlike vas-pmo and the storefront it does not talk
  # to Odoo at all: it reads prd_levis_begbal directly as `cockpit_ro`, a role
  # whose sessions Postgres itself forces read-only and which pg_hba only lets
  # reach that one database. Aggregating 52k POS lines across six dimensions is
  # far cheaper in SQL than through the ORM.
  #
  # Requires the cockpit_ro pg_hba entries — see sales-cockpit/README.md. The
  # container starts fine without them and answers 503 on /cockpit/api/health.
  sales-cockpit:
    build:
      context: ./sales-cockpit
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-sales-cockpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-sales-cockpit
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /app/.next/cache:rw,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      # Next's standalone server binds to $HOSTNAME, which docker sets to the
      # container id. Without this it listens on that name only and the
      # healthcheck (127.0.0.1) is refused.
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      COCKPIT_DB_HOST: ${COCKPIT_DB_HOST:-postgres}
      COCKPIT_DB_PORT: ${COCKPIT_DB_PORT:-5432}
      COCKPIT_DB_NAME: ${COCKPIT_DB_NAME:-prd_levis_begbal}
      COCKPIT_DB_USER: ${COCKPIT_DB_USER:-cockpit_ro}
      # Read-only role; still a production credential, so it stays in .env.
      COCKPIT_DB_PASSWORD: ${COCKPIT_DB_PASSWORD}
      COCKPIT_DB_POOL_MAX: ${COCKPIT_DB_POOL_MAX:-8}
      # Login is Odoo's own. Must be odoo-front — the public `odoo` runs
      # dbfilter ^%d$$ and answers "Database not found" for this tenant.
      COCKPIT_ODOO_URL: ${COCKPIT_ODOO_URL:-http://odoo-front:8069}
      COCKPIT_SESSION_SECRET: ${COCKPIT_SESSION_SECRET}
      COCKPIT_SESSION_TTL: ${COCKPIT_SESSION_TTL:-43200}
      # The assistant. Its deterministic skill catalogue needs nothing here;
      # these two only enable the Claude fallback for questions the catalogue
      # cannot place. Leave COCKPIT_AGENT_URL empty and the widget still works,
      # unmatched questions simply get an honest refusal.
      COCKPIT_AGENT_URL: ${COCKPIT_AGENT_URL:-}
      COCKPIT_AGENT_SECRET: ${COCKPIT_AGENT_SECRET:-}
    ports:
      # Loopback only, on purpose: there is no authentication yet, and this port
      # would otherwise serve every store's revenue to anything on the LAN.
      # Reach it over an SSH tunnel, the way odoo-mgmt is reached. Drop the
      # 127.0.0.1 prefix once the Odoo-backed login lands.
      - "127.0.0.1:${SALES_COCKPIT_PORT:-18130}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/cockpit/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 512m

  # The assistant's escalation path. Holds NO database credentials: it reaches
  # prd_levis_begbal only through the cockpit's HMAC-signed skill endpoint,
  # which accepts a catalogued skill name and validated arguments — never SQL.
  cockpit-agent:
    build:
      context: ./cockpit-agent
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-cockpit-agent:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-cockpit-agent
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=16m,mode=1777
    depends_on:
      sales-cockpit:
        condition: service_healthy
    environment:
      PORT: 8080
      NODE_ENV: production
      # Must carry the cockpit's basePath.
      COCKPIT_URL: ${COCKPIT_URL:-http://sales-cockpit:8080/cockpit}
      COCKPIT_AGENT_SECRET: ${COCKPIT_AGENT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      COCKPIT_AGENT_MODEL: ${COCKPIT_AGENT_MODEL:-claude-opus-5}
      COCKPIT_AGENT_EFFORT: ${COCKPIT_AGENT_EFFORT:-low}
    ports:
      # Loopback only, and deliberately absent from the Caddyfile: the cockpit
      # is the sole caller, over the compose network.
      - "127.0.0.1:${COCKPIT_AGENT_PORT:-18131}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          memory: 256m

  # Levi's Finance & Accounting dashboard. Same arrangement as sales-cockpit —
  # reads prd_levis_begbal directly, login goes through Odoo — but with its own
  # Postgres role, `finance_ro`. The two grant lists are deliberately separate:
  # this one reaches the ledger, the bank statements and the POS clearing runs,
  # and that reach has no business hanging off a sales dashboard's credential.
  #
  # Requires the finance_ro pg_hba entries — see finance-cockpit/README.md. The
  # container starts fine without them and answers 503 on /finance/api/health.
  finance-cockpit:
    build:
      context: ./finance-cockpit
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-finance-cockpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-finance-cockpit
    <<: [*restart-policy, *default-logging]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
      - /app/.next/cache:rw,size=64m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      # Next's standalone server binds to $HOSTNAME, which docker sets to the
      # container id. Without this it listens on that name only and the
      # healthcheck (127.0.0.1) is refused.
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      FINANCE_DB_HOST: ${FINANCE_DB_HOST:-postgres}
      FINANCE_DB_PORT: ${FINANCE_DB_PORT:-5432}
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-prd_levis_begbal}
      FINANCE_DB_USER: ${FINANCE_DB_USER:-finance_ro}
      # Read-only role; still a production credential, so it stays in .env.
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD}
      FINANCE_DB_POOL_MAX: ${FINANCE_DB_POOL_MAX:-8}
      # Login is Odoo's own. Must be odoo-front — the public `odoo` runs
      # dbfilter ^%d$$ and answers "Database not found" for this tenant.
      FINANCE_ODOO_URL: ${FINANCE_ODOO_URL:-http://odoo-front:8069}
      FINANCE_SESSION_SECRET: ${FINANCE_SESSION_SECRET}
      FINANCE_SESSION_TTL: ${FINANCE_SESSION_TTL:-43200}
    ports:
      # Loopback only, like sales-cockpit: Caddy is the only front door, and
      # this port would otherwise serve the whole ledger to anything on the LAN.
      - "127.0.0.1:${FINANCE_COCKPIT_PORT:-18132}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/finance/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          # Larger than sales-cockpit: netting one GR/IR account holds ~59k
          # rows in memory for the moment it takes to run.
          memory: 768m

networks:
  odoo-net:
    driver: bridge
    name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-net
