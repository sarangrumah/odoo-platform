<style>
  /* GentleWoman document style — Erajaya VAS palette (slate text, red accent only). */
  @page { size: A4; margin: 18mm 16mm 16mm 16mm; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    color: #111827;
    line-height: 1.5;
    font-size: 11pt;
    max-width: 980px;
    margin: 0 auto;
    padding: 0 0.5em;
  }
  h1 {
    color: #E30613;
    font-size: 19pt;
    border-bottom: 3px solid #E30613;
    padding-bottom: 0.25em;
    margin-top: 0;
    page-break-before: always;
    page-break-after: avoid;
  }
  h1:first-of-type { page-break-before: auto; }
  h2 { color: #B8050F; font-size: 14pt; margin-top: 1.4em; page-break-after: avoid; }
  h3 { color: #1F2937; font-size: 12pt; margin-top: 1.1em; page-break-after: avoid; }
  p, li { font-size: 11pt; }
  strong { color: #1F2937; }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.8em 0;
    font-size: 10pt;
    page-break-inside: avoid;
  }
  th, td {
    border: 1px solid #E7E5E2;
    padding: 0.45em 0.7em;
    text-align: left;
    vertical-align: top;
  }
  th { background: #FEE2E4; color: #B8050F; font-weight: 600; }
  tr:nth-child(even) td { background: #F9FAFB; }
  code {
    background: #F3F4F6;
    padding: 0.1em 0.35em;
    border-radius: 3px;
    font-size: 0.88em;
    color: #1F2937;
  }
  pre {
    background: #1F2937;
    color: #F9FAFB;
    padding: 0.9em 1.1em;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 8.5pt;
    line-height: 1.35;
    page-break-inside: avoid;
  }
  pre code { background: transparent; color: inherit; padding: 0; }
  blockquote {
    border-left: 4px solid #E30613;
    background: #F9FAFB;
    padding: 0.5em 1em;
    margin: 1em 0;
    color: #374151;
  }
  hr { border: none; border-top: 2px solid #E7E5E2; margin: 1.4em 0; }
  a { color: #B8050F; text-decoration: none; }
  em { color: #6B7280; }
</style>
