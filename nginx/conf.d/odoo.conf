## ===========================================================
## Odoo reverse proxy — TLS + longpolling + rate-limit
## ===========================================================

# Redirect HTTP → HTTPS, except healthz
server {
    listen 80 default_server;
    server_name _;

    location = /healthz { return 200 "ok\n"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Re-resolve backends at runtime via Docker's embedded DNS (127.0.0.11) so an
    # `odoo` container restart that changes its IP can never leave nginx proxying
    # a stale IP. (A stale cached IP once silently routed all backoffice traffic
    # to the `odoo-mgmt` container -> intermittent RPC 404 + AssetsLoadingError.)
    # Paired with the variable `proxy_pass http://$odoo_backend` targets below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # ----- ModSecurity WAF (opt-in — see nginx/modsecurity/README.md) -----
    # Uncomment after building a modsecurity-nginx-enabled image.
    # modsecurity on;
    # modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

    # ----- TLS (place certs at ./nginx/certs/) -----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5:!DSS;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ----- Security headers -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy $csp_value always;

    # ----- Connection caps -----
    limit_conn conn_per_ip 50;

    # ----- Longpolling (pre-16 spelling, kept only for stale tabs) -----
    # Odoo 19 has no /longpolling/ endpoints at all — the bus moved to
    # /websocket, handled below. Nothing a current client does lands here; only
    # a browser tab left open across the upgrade can still ask for it.
    #
    # Deliberately 8069, NOT the evented 8072. On 8072 these requests die with
    # `KeyError: 'REQUEST_URI'` inside odoo/http.py before routing even happens
    # — gevent's WSGI environ has no REQUEST_URI — so a stale tab got a 500 and
    # a traceback in the log for what is simply a gone endpoint. 8069 answers a
    # clean 404, which is the honest response and is what the tab deserves.
    #
    # Upgrade headers stay so the block keeps working if a route is ever
    # restored here; today they are inert, since 8069 refuses upgrades anyway.
    location /longpolling/ {
        set $odoo_lp "odoo:8069";
        proxy_pass http://$odoo_lp;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling - Upgrade forwarding is required for Odoo longpolling/websockets to a trusted internal backend
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ----- Websocket (Odoo 16+ renamed /longpolling/ to /websocket) -----
    # Same backend, same reason as the block above: the bus is served by the
    # evented worker on 8072, and a handshake reaching 8069 is refused by Odoo
    # with "Couldn't bind the websocket". Without this, /websocket fell through
    # to `location /` -> odoo:8069. It went unnoticed because the tenant
    # hostnames see little traffic; the identical gap on the Caddy front door
    # (which bypasses this file) was flooding 1,585 errors an hour on
    # 11-Aug-2026 before both were fixed.
    location /websocket {
        set $odoo_ws "odoo:8072";
        proxy_pass http://$odoo_ws;
        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling - Upgrade forwarding is required for Odoo longpolling/websockets to a trusted internal backend
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ----- Login throttling -----
    location ~ ^/(web/login|web/reset_password) {
        limit_req zone=odoo_login burst=10 nodelay;
        set $odoo_backend "odoo:8069";
        proxy_pass http://$odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }

    # ----- Block /web/database/manager in prod -----
    # Re-enabled 2026-08-05 (was commented out "TEMPORARILY ... FOR DEMO").
    # Defence in depth only: the front door does not pass through nginx at all
    # (Caddy proxies it straight to odoo-front, which runs LIST_DB=False and
    # refuses these routes itself, and blocks /web/database/* in its own route
    # table). This covers whatever still reaches Odoo via nginx.
    location ~ ^/web/database/(manager|create|drop|backup|restore|duplicate) {
        deny all;
        return 404;
    }

    # ----- Default Odoo -----
    location / {
        limit_req zone=odoo_api burst=60 nodelay;
        set $odoo_backend "odoo:8069";
        proxy_pass http://$odoo_backend;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 720s;
        proxy_connect_timeout 720s;
        proxy_send_timeout 720s;

        # Static / cached
        location ~* /web/static/ {
            set $odoo_backend "odoo:8069";
            proxy_cache_valid 200 60m;
            proxy_buffering on;
            expires 30d;
            proxy_pass http://$odoo_backend;
        }
    }

    location = /healthz { return 200 "ok\n"; }
}
