# Dedicated TLS sidecar for the BFF→Odoo hop ONLY.
# Pure TLS termination → odoo:8069, with NONE of the Odoo-web tuning
# (no login throttle, no redirects, no regex/static locations) that breaks
# storefront POSTs. The storefront pins this cert (lib/odoo.ts).
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    # Re-resolve the `odoo` service via Docker's embedded DNS at runtime so a
    # recreated Odoo container (new IP) doesn't leave a stale upstream pinned
    # at startup → 502 "Connection refused". Paired with the variable
    # `proxy_pass http://$odoo_backend` below.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $odoo_backend odoo:8069;
        proxy_pass http://$odoo_backend;
        # Buffer the request so Odoo receives a Content-Length (avoid chunked
        # upstream, which the threaded Odoo server handles inconsistently).
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        # All other request headers (incl. X-Odoo-Database, Authorization) pass through.
    }
}
