# ============================================================
# Local LLM override: Ollama for self-hosted models.
# Optional. Pull a model once Ollama is up:
#   docker compose exec ollama ollama pull llama3.2
# Use:  docker compose -f docker-compose.yml \
#                      -f docker-compose.dev.yml \
#                      -f docker-compose.local-llm.yml up -d
# Set AI_PROVIDER=ollama in .env to route gateway traffic here.
# ============================================================

services:

  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-odoo19-platform}-ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      # Keep inference threads <= the CPU limit below so Ollama can't saturate
      # the host. 8-core box: cap at 4, leaving headroom for Odoo/Postgres.
      OLLAMA_NUM_THREAD: "4"
      # Unload the model 30s after the last request to free ~5.3GB RAM quickly.
      # Trade-off: first request after idle reloads the model from disk (+few s).
      OLLAMA_KEEP_ALIVE: "30s"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [odoo-net]
    deploy:
      resources:
        limits:
          # Hard cap: Ollama CPU inference may use at most 4 of 8 cores, so a
          # single generation request can no longer drive host CPU to ~99%.
          cpus: "4.0"
          memory: 8g
